# Server port
server.port=8082

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=verification-group
kafka.topic.notifications=notifications
kafka.topic.infraction-alerts=infraction-alerts
kafka.topic.infraction-confirmations=infraction-confirmations
kafka.topic.infraction-cancellations=infraction-cancellations

# External Services URL
certidocs.api.base-url=http://host.docker.internal:8080/api/certidocs # Placeholder URL
certidocs.api.token=YOUR_TOKEN_HERE # Placeholder token

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/infractions_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Storage Configuration
file.storage.location=/storage

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
