# Server port
server.port=8083

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust the package of the incoming DTO from verification-service
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.common.dto

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/infractions_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Infraction Service URL (pour le client Feign)
infraction.service.url=http://infraction-service:8083

# SMS Configuration
# Provider: twilio (utilisé pour développement et production)
sms.provider=twilio
# Configuration Twilio (à configurer via variables d'environnement ou secrets)
# Les valeurs par défaut peuvent être définies ici, mais les secrets doivent être dans les variables d'environnement
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Client Portal URL (pour les liens dans les SMS)
client.portal.base-url=http://192.168.1.177:8001
