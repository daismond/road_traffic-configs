# Server port
server.port=8083

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=infraction-service

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/infractions_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Notification Service URL (pour le client Feign SMS)
notification.service.url=http://notification-service:8083

# MinIO Service URL (pour le client Feign)
minio.service.url=http://minio-service:8087

# Feign Configuration - Activer les fallbacks et augmenter les timeouts
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.circuitbreaker.enabled=true
feign.hystrix.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

