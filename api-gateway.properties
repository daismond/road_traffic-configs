# Port for the API Gateway
server.port=8080

# Enable the Gateway to use the DiscoveryClient (Eureka to find services
spring.cloud.gateway.discovery.locator.enabled=false

# --- Route Definitions ---

# Route requests for the ingestion service
# All requests starting with /ingest/ will be routed to the service named 'ingestion-service' found in Eureka.
spring.cloud.gateway.routes[0].id=ingestion-service-route
spring.cloud.gateway.routes[0].uri=lb://ingestion-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/ingest/**

# Route requests for the mobile-api-service (currently handled by roadtraffic-app)
spring.cloud.gateway.routes[1].id=mobile-api-route
spring.cloud.gateway.routes[1].uri=lb://verification-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/mobile/v1/**, /auth/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/mobile/v1/(?<segment>.*), /api/v1/mobile/${segment}

# Route requests for the verification service
spring.cloud.gateway.routes[2].id=verification-service-route
spring.cloud.gateway.routes[2].uri=lb://verification-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/verification/api/v1/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/verification/(?<segment>.*), /${segment}

# Route requests for admin endpoints (frontend user management)
spring.cloud.gateway.routes[3].id=admin-route
spring.cloud.gateway.routes[3].uri=http://roadtraffic-app:8080
spring.cloud.gateway.routes[3].predicates[0]=Path=/admin/**

# Route requests for infraction service - POST endpoint confirm infraction
# IMPORTANT: Cette route doit être AVANT la route générale /api/v1/infractions/**
spring.cloud.gateway.routes[4].id=infraction-service-infraction-confirm-route
spring.cloud.gateway.routes[4].uri=lb://infraction-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/infractions/*/confirm

# Route requests for infraction service - POST endpoint cancel infraction
spring.cloud.gateway.routes[5].id=infraction-service-infraction-cancel-route
spring.cloud.gateway.routes[5].uri=lb://infraction-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/infractions/*/cancel

# Route requests for infraction service - infractions endpoints (exact match)
spring.cloud.gateway.routes[6].id=infraction-service-infractions-exact-route
spring.cloud.gateway.routes[6].uri=lb://infraction-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/infractions

# Route requests for infraction service - infractions endpoints (with sub-paths)
# Cette route capture les GET /api/v1/infractions/** mais pas les POST /confirm ou /cancel
# (car les routes 4 et 5 sont évaluées en premier)
spring.cloud.gateway.routes[7].id=infraction-service-infractions-route
spring.cloud.gateway.routes[7].uri=lb://infraction-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/infractions/**

# Route requests for infraction service - dashboard stats endpoint
spring.cloud.gateway.routes[8].id=infraction-service-dashboard-stats-route
spring.cloud.gateway.routes[8].uri=lb://infraction-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/dashboard/**

# Route requests for verification service - vehicles search endpoint (must be before route 9)
spring.cloud.gateway.routes[9].id=verification-service-vehicles-search-route
spring.cloud.gateway.routes[9].uri=lb://verification-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/vehicles/search/**

# Route requests for verification service - vehicles sync endpoint
spring.cloud.gateway.routes[10].id=verification-service-vehicles-sync-route
spring.cloud.gateway.routes[10].uri=lb://verification-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/vehicles/sync/**

# Route requests for verification service - vehicles list endpoint (exact match)
spring.cloud.gateway.routes[11].id=verification-service-vehicles-list-route
spring.cloud.gateway.routes[11].uri=lb://verification-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/vehicles

# Route requests for verification service - vehicles update endpoint
spring.cloud.gateway.routes[12].id=verification-service-vehicles-update-route
spring.cloud.gateway.routes[12].uri=lb://verification-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/vehicles/*/update

# Route requests for infraction service - vehicles endpoints (history, infractions, stats)
spring.cloud.gateway.routes[13].id=infraction-service-vehicles-route
spring.cloud.gateway.routes[13].uri=lb://infraction-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/v1/vehicles/**

# Route requests for infraction service - subscriptions endpoints
spring.cloud.gateway.routes[14].id=infraction-service-subscriptions-route
spring.cloud.gateway.routes[14].uri=lb://infraction-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/v1/subscriptions/**

# Route requests for public client portal (espace client) - route courte pour SMS (HTML page)
# Cette route sert le fichier HTML client.html depuis le frontend
# Vite copie les fichiers de public/ vers la racine de dist/, donc client.html est accessible à /client.html
spring.cloud.gateway.routes[15].id=frontend-client-route
spring.cloud.gateway.routes[15].uri=http://roadtraffic-frontend:80
spring.cloud.gateway.routes[15].predicates[0]=Path=/client/infractions
spring.cloud.gateway.routes[15].filters[0]=RewritePath=/client/infractions, /client.html

# Route requests for public client portal (espace client) - route complète API
spring.cloud.gateway.routes[16].id=infraction-service-public-client-route
spring.cloud.gateway.routes[16].uri=lb://infraction-service
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/v1/public/client/**

# Route requests for users service - groups endpoints
spring.cloud.gateway.routes[17].id=users-service-groups-route
spring.cloud.gateway.routes[17].uri=lb://users-service
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/v1/groups/**

# Route requests for infraction service - tariffs endpoints (exact match)
spring.cloud.gateway.routes[18].id=infraction-service-tariffs-exact-route
spring.cloud.gateway.routes[18].uri=lb://infraction-service
spring.cloud.gateway.routes[18].predicates[0]=Path=/api/v1/tariffs

# Route requests for infraction service - tariffs endpoints (with sub-paths)
spring.cloud.gateway.routes[19].id=infraction-service-tariffs-route
spring.cloud.gateway.routes[19].uri=lb://infraction-service
spring.cloud.gateway.routes[19].predicates[0]=Path=/api/v1/tariffs/**

# Route requests for infraction service - infraction types endpoints (exact match)
spring.cloud.gateway.routes[20].id=infraction-service-infraction-types-exact-route
spring.cloud.gateway.routes[20].uri=lb://infraction-service
spring.cloud.gateway.routes[20].predicates[0]=Path=/api/v1/infraction-types

# Route requests for infraction service - infraction types endpoints (with sub-paths)
spring.cloud.gateway.routes[21].id=infraction-service-infraction-types-route
spring.cloud.gateway.routes[21].uri=lb://infraction-service
spring.cloud.gateway.routes[21].predicates[0]=Path=/api/v1/infraction-types/**

# Route requests for infraction service - penalties endpoints (exact match)
spring.cloud.gateway.routes[22].id=infraction-service-penalties-exact-route
spring.cloud.gateway.routes[22].uri=lb://infraction-service
spring.cloud.gateway.routes[22].predicates[0]=Path=/api/v1/penalties

# Route requests for infraction service - penalties endpoints (with sub-paths)
spring.cloud.gateway.routes[23].id=infraction-service-penalties-route
spring.cloud.gateway.routes[23].uri=lb://infraction-service
spring.cloud.gateway.routes[23].predicates[0]=Path=/api/v1/penalties/**

# Route requests for API v1 endpoints (other endpoints go to verification-service)
# This route must be LAST to catch remaining /api/v1/** paths
spring.cloud.gateway.routes[24].id=api-v1-route
spring.cloud.gateway.routes[24].uri=lb://verification-service
spring.cloud.gateway.routes[24].predicates[0]=Path=/api/v1/**

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka
eureka.client.enabled=true

# CORS Configuration is handled by GatewayCorsConfiguration.java
# (removed duplicate CORS config from properties to avoid multiple headers)
